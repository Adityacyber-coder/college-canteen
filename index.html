<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Canteen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f3;--card:#fff;--tx:#10302c;--mu:#5d7773;--ac:#0f766e;--hi:#ffb703;--bd:#d6e1de;--ok:#16a34a;--board:#0a1f1d;--boardtx:#ffd166}
@media(prefers-color-scheme:dark){:root{--bg:#0b1615;--card:#13282a;--tx:#e8f3f1;--mu:#8fa9a5;--ac:#2dd4bf;--bd:#244240;--ok:#4ade80;--board:#050f0e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:110px}
.wrap{max-width:780px;margin:auto;padding:0 16px}
/* hero + flip board */
.hero{background:var(--board);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 0 26px;border-radius:0 0 28px 28px}
.hero h1{margin:0;font-size:clamp(30px,7vw,46px);line-height:1.05;font-weight:800;letter-spacing:-1.2px}
.hero p{margin:6px 0 16px;color:#9fc5bf}
.board{background:#000;border:1px solid #1f3d3a;border-radius:14px;padding:10px 12px}
.board h3{margin:0 0 6px;font-size:13px;font-weight:600;color:#7fa8a2;display:flex;justify-content:space-between}
.live{color:#4ade80}.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:6px;animation:pulse 1.4s infinite}
.brow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed #1f3d3a;font-variant-numeric:tabular-nums}
.brow:first-of-type{border-top:0}
.cells{display:flex;gap:3px}
.cell{background:#12201f;color:var(--boardtx);font-weight:800;font-size:22px;width:26px;height:36px;display:grid;place-items:center;border-radius:5px;position:relative}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.flip .cell{animation:flip .6s ease both}.flip .cell:nth-child(2){animation-delay:.07s}.flip .cell:nth-child(3){animation-delay:.14s}
.bst{margin-left:auto;font-weight:600;color:var(--boardtx)}
.bst.Ready{color:#4ade80;animation:pulse 1.2s infinite}
.bnm{color:#9fc5bf;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
.bempty{color:#6e918b;padding:10px 0;font-size:14px}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{50%{opacity:.35}}
/* nav */
nav{display:flex;gap:8px;margin:16px 0 8px;position:sticky;top:0;z-index:5;padding:8px 0;background:var(--bg)}
.tab,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:99px;font:inherit;cursor:pointer;white-space:nowrap;transition:transform .15s}
.tab:active,.chip:active{transform:scale(.95)}
.tab.on,.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tab .n{background:var(--hi);color:#10302c;border-radius:99px;padding:0 7px;margin-left:6px;font-size:13px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.search{width:100%;padding:11px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
/* menu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.dish{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.dish.off{opacity:.45;filter:grayscale(1)}
.dish{animation:rise .55s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--i)*50ms);transition:transform .25s,box-shadow .25s}
.dish:hover{transform:translateY(-4px);box-shadow:0 14px 28px #0a1f1d22}
.dish b{display:block;margin-top:4px;min-height:42px}
.pic{height:150px;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--t) 20%,#f1ece0),color-mix(in srgb,var(--t) 38%,#cfc6b3));position:relative}
.pic svg{animation:float 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s);filter:drop-shadow(0 8px 6px #0003);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.dish:hover .pic svg{transform:scale(1.14) rotate(-5deg)}
.steam path{opacity:0;animation:steam 2.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
.who{display:flex;align-items:center;gap:10px}
.qty b{animation:pop .3s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:none}}
.dish b{font-size:17px;line-height:1.2}
.meta{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:8px}
.veg{width:14px;height:14px;border:2px solid var(--ok);display:inline-grid;place-items:center;border-radius:3px}
.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.veg.nv{border-color:#dc2626}.veg.nv::after{background:#dc2626}
.price{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:20px;font-weight:800}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s}
@media(prefers-color-scheme:dark){.btn{color:#04201d}}
.btn:active{transform:scale(.95)}.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.gold{background:var(--hi);color:#10302c}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer}
/* cart bar + sheet */
.bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:756px;margin:auto;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #0006;animation:up .35s cubic-bezier(.2,1.2,.4,1);z-index:8}
@keyframes up{from{transform:translateY(90px)}}
.sheet-bg{position:fixed;inset:0;background:#0009;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:780px;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:85vh;overflow:auto;animation:up .3s ease}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin:14px 0}
/* ticket + progress */
.ticket{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:12px;overflow:hidden}
.ticket .top{display:flex;gap:14px;padding:14px;align-items:center}
.ticket .stub{background:var(--hi);color:#10302c;padding:14px 16px;text-align:center;font-weight:800;font-size:34px;line-height:1;border-right:2px dashed var(--bg);min-width:92px}
.ticket .stub small{display:block;font-size:11px;font-weight:600;margin-bottom:4px}
.steps{display:flex;padding:4px 14px 16px}
.step{flex:1;text-align:center;font-size:12px;color:var(--mu);position:relative}
.step i{display:block;width:16px;height:16px;border-radius:50%;background:var(--bd);margin:0 auto 4px;position:relative;z-index:1}
.step::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--bd)}
.step:first-child::before{display:none}
.step.done{color:var(--tx)}.step.done i,.step.done::before{background:var(--ac)}
.step.now i{box-shadow:0 0 0 5px color-mix(in srgb,var(--hi) 45%,transparent);background:var(--hi);animation:pulse 1.2s infinite}
.step.now{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
h2{font-size:20px;margin:20px 0 8px}
input.f{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);width:100%}
.row{display:flex;gap:8px;margin:8px 0}
.empty{color:var(--mu);text-align:center;padding:36px 0}
.empty .em{display:block;font-size:54px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;font-weight:600;animation:down .4s cubic-bezier(.2,1.3,.4,1);max-width:90%}
@keyframes down{from{transform:translate(-50%,-80px)}}
.conf{position:fixed;top:40%;left:50%;font-size:22px;z-index:30;pointer-events:none;animation:burst 1.3s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.heart{position:absolute;top:22px;right:22px;width:34px;height:34px;border-radius:50%;border:0;background:#fffd;color:#94a3b8;font-size:18px;cursor:pointer;display:grid;place-items:center;z-index:2;transition:transform .2s}
.heart:active{transform:scale(.85)}.heart.on{color:#ef4444;animation:pop .35s}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;animation:fade .5s;transition:transform .5s}
.dish:hover .ph{transform:scale(1.08)}
@keyframes fade{from{opacity:0}}
.mh{position:absolute;bottom:8px;left:8px;background:var(--hi);color:#10302c;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;z-index:2}
.left{color:#c2410c;font-size:12px;font-weight:700;margin-left:auto}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar2{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.bar2 span:first-child{width:86px;color:var(--mu)}
.bar2 i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--hi));min-width:4px;transition:width .8s}
.inv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--bd)}
.inv .nm{flex:1 1 150px;font-weight:600}.inv .f{width:84px}.inv .btn{padding:7px 11px}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--bd);color:var(--tx)}
.badge.x{background:#fecaca;color:#7f1d1d}
select.f{width:auto}
@media print{body>*:not(#sheet){display:none!important}.sheet-bg{position:static;background:none}.sheet{max-height:none;border-radius:0}.noprint{display:none!important}}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const left=m=>m.stock==null?Infinity:m.stock, avail=m=>m.on&&left(m)>0;
function disc(){const t=total();if(coupon==="STUDENT10")return Math.round(t*.1);if(coupon==="SAVE20"&&t>=150)return 20;return 0}
function fav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];sv("favs",favs);render()}
function setPay(p){note=$("#note").value;pay=p;render()}
function applyCoupon(){const c=$("#cp").value.trim().toUpperCase();note=$("#note").value;
  if(c==="STUDENT10"||(c==="SAVE20"&&total()>=150)){coupon=c;toast("Coupon "+c+" applied.")}
  else{coupon="";toast(c==="SAVE20"?"SAVE20 needs an order of ₹150 or more.":"That coupon code isn't valid.")}render()}
function cancel(t){const o=orders.find(o=>o.token===t);if(!o||o.status!=="Placed"||!confirm("Cancel order "+t+"?"))return;
  o.status="Cancelled";o.items.forEach(x=>{const m=M(x.id);if(m&&m.stock!=null)m.stock+=x.q});sv("orders",orders);sv("menu5",menu);render();toast("Order "+t+" cancelled.")}
function reorder(t){const o=orders.find(o=>o.token===t);cart={};o.items.forEach(x=>{const m=M(x.id);if(m&&avail(m))cart[m.id]=Math.min(x.q,left(m))});
  tab="menu";showCart=count()>0;if(!count())toast("Those items aren't available right now.");render()}
function setPrice(id,v){v=+v;if(v>0){M(id).price=v;sv("menu5",menu)}else toast("Price must be above 0.");render()}
function setStock(id,v){M(id).stock=v===""?null:Math.max(0,+v);sv("menu5",menu);render()}
function delItem(id){if(!confirm("Delete "+M(id).name+" from the menu?"))return;menu=menu.filter(m=>m.id!=id);delete cart[id];sv("menu5",menu);render()}
function exportCSV(){
  const safe=c=>{const t=String(c);return '"'+((/^[=+\-@]/.test(t)?"'":"")+t).replace(/"/g,'""')+'"'};
  const rows=[["Token","Time","Customer","Items","Total","Payment","Status"],...orders.map(o=>[o.token,new Date(o.at).toLocaleString(),o.who,o.items.map(x=>x.q+" x "+x.name).join("; "),o.total,o.pay||"",o.status])];
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(safe).join(",")).join("\n")],{type:"text/csv"}));a.download="canteen-orders.csv";a.click()}
function rcptHTML(o){
  return `<div class="sheet-bg" onclick="if(event.target===this){rcpt=0;render()}"><div class="sheet"><div style="text-align:center"><h2 style="margin:0">College Canteen</h2>
  <div class="meta" style="justify-content:center">Receipt · Token ${o.token} · ${new Date(o.at).toLocaleString()}</div><div class="meta" style="justify-content:center">${esc(o.who)}</div></div>`+
  o.items.map(x=>`<div class="line"><span>${x.q}× ${esc(x.name)}</span><span>${x.price?money(x.q*x.price):""}</span></div>`).join("")+
  `<div class="line"><span>Subtotal</span><span>${money(o.sub??o.total)}</span></div>`+(o.disc?`<div class="line"><span>Discount (${o.coupon})</span><span>−${money(o.disc)}</span></div>`:"")+
  `<div class="sum"><span>Total</span><span>${money(o.total)}</span></div><div class="meta" style="justify-content:center">Paid via ${o.pay||"Cash"} · Thank you!</div>
  <div class="row noprint" style="margin-top:16px"><button class="btn" onclick="print()">Print</button><button class="btn alt" onclick="rcpt=0;render()">Close</button></div></div></div>`}

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3200)}
function confetti(){const f=$("#fx");f.innerHTML="";for(let i=0;i<34;i++){const s=document.createElement("span");s.className="conf";s.textContent=["🎉","✨","🍕","🥳","🍛"][i%5];s.style.cssText=`--x:${(Math.random()-.5)*420}px;--y:${(Math.random()-.8)*360}px;--r:${Math.random()*540}deg`;f.append(s)}setTimeout(()=>f.innerHTML="",1500)}

function setTab(t){
  if(t==="admin"&&!admin){if(prompt("Enter staff PIN")!=="1234"){toast("Wrong PIN. Ask the canteen manager.");return}admin=true}
  tab=t;render();scrollTo({top:0})
}
function add(id,d){const m=M(id);if(d>0&&(cart[id]||0)>=left(m)){toast("Only "+m.stock+" left of "+m.name+".");return}
  cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];if(!count())showCart=false;render()}
function placeOrder(){
  if(!me){me=(prompt("Your name or roll number")||"").trim();if(!me)return;sv("me",me)}
  note=($("#note")||{value:note}).value.trim();
  const token=orders.reduce((m,o)=>Math.max(m,o.token),100)+1;
  const wait=Math.max(...Object.keys(cart).map(id=>M(id).t))+active().length*2;
  const sub=total(),d=disc();
  const items=Object.entries(cart).map(([id,n])=>({id:M(id).id,name:M(id).name,q:n,price:M(id).price,cat:M(id).cat}));
  items.forEach(x=>{const m=M(x.id);if(m.stock!=null)m.stock=Math.max(0,m.stock-x.q)});
  orders.push({token,who:me,items,sub,disc:d,coupon:d?coupon:"",total:sub-d,pay,note,status:"Placed",at:Date.now(),wait});
  sv("orders",orders);sv("menu5",menu);cart={};coupon="";note="";showCart=false;tab="orders";render();confetti();toast("Order placed. Your token is "+token+".")}
function advance(t){const o=orders.find(o=>o.token===t),i=FLOW.indexOf(o.status);if(i<3){o.status=FLOW[i+1];sv("orders",orders);render()}}
function toggle(id){M(id).on=!M(id).on;sv("menu5",menu);render()}
function addItem(){
  const n=$("#nn").value.trim(),p=+$("#np").value,c=$("#nc").value.trim()||"Snacks",st=$("#ns").value;
  if(!n||!(p>0)){toast("Enter an item name and a price above 0.");return}
  menu.push(mk(Date.now(),n,p,c,$("#nt").value,1,5,"#0f766e","#fbbf24",1,st===""?null:Math.max(0,+st)));sv("menu5",menu);render();toast(n+" added to the menu.")}
function resetAll(){if(confirm("Delete all orders and restore the default menu?")){orders=[];menu=JSON.parse(JSON.stringify(D));sv("orders",orders);sv("menu5",menu);render()}}

// live sync between tabs/windows on the same device
addEventListener("storage",()=>{
  const old=Object.fromEntries(orders.map(o=>[o.token,o.status]));
  orders=ld("orders",[]);menu=ld("menu5",D);
  orders.forEach(o=>{if(o.who===me&&o.status==="Ready"&&old[o.token]!=="Ready"){toast(`Token ${o.token} is ready. Come pick it up.`);confetti()}});
  render()
});

function boardHTML(){
  const L=active().slice(-5).reverse();
  return `<h3><span>NOW SERVING</span><span class="live">live</span></h3>`+(L.length?L.map(o=>{
    const ch=prev[o.token]!==o.status;
    return `<div class="brow ${ch?"flip":""}"><div class="cells">${String(o.token).split("").map(c=>`<div class="cell">${c}</div>`).join("")}</div><span class="bnm">${esc(o.who)}</span><span class="bst ${o.status}">${o.status}</span></div>`}).join(""):`<div class="bempty">Kitchen is quiet. Place the first order of the day.</div>`);
}
function dish(m,i){
  const c=cart[m.id],ok=avail(m),l=left(m);
  return `<div class="dish ${ok?"":"off"}" style="--i:${i}"><button class="heart ${favs.includes(m.id)?"on":""}" aria-label="Favourite ${esc(m.name)}" onclick="fav(${m.id})">♥</button>
  <div class="pic" style="--t:${m.f}">${MH.has(m.id)?`<span class="mh">Maharashtra</span>`:""}${art(m,132)}<img class="ph" src="images/${slug(m.name)}.jpg" alt="${esc(m.name)}" loading="lazy" onerror="this.remove()"></div><b>${esc(m.name)}</b>
  <div class="meta"><span class="veg ${m.v?"":"nv"}" title="${m.v?"Veg":"Non-veg"}"></span>${m.t} min${ok&&l<=5?`<span class="left">Only ${l} left</span>`:""}</div>
  <div class="price">${money(m.price)}${!ok?`<small class="meta">Sold out</small>`:c?`<div class="qty"><button aria-label="Remove one ${esc(m.name)}" onclick="add(${m.id},-1)">−</button><b>${c}</b><button aria-label="Add one ${esc(m.name)}" onclick="add(${m.id},1)">+</button></div>`:`<button class="btn" onclick="add(${m.id},1)">Add</button>`}</div></div>`}
function viewMenu(){
  const cats=["All","Favourites","Maharashtrian",...new Set(menu.map(m=>m.cat))];
  const L=menu.filter(m=>(cat==="All"||(cat==="Favourites"?favs.includes(m.id):cat==="Maharashtrian"?MH.has(m.id):m.cat===cat))&&m.name.toLowerCase().includes(q.toLowerCase()));
  return `<input class="search" id="q" placeholder="Search for dosa, pizza, lassi" aria-label="Search menu" value="${esc(q)}">
  <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" onclick="cat='${c}';render()">${c==="Favourites"?"♥ Favourites":c==="Maharashtrian"?"Maharashtrian special":c}</button>`).join("")}</div>`+
  (L.length?`<div class="grid">${L.map(dish).join("")}</div>`:`<div class="empty"><span class="em">${cat==="Favourites"&&!q?"💛":"🔍"}</span>${cat==="Favourites"&&!q?"Tap the heart on a dish to save it here.":"Nothing matches. Try another word or pick All."}</div>`)}
function ticket(o,staff){
  const i=FLOW.indexOf(o.status),x=o.status==="Cancelled";
  return `<div class="ticket" ${x?'style="opacity:.6"':""}><div class="top"><div class="stub"><small>TOKEN</small>${o.token}</div><div style="flex:1">
  <div>${o.items.map(t=>`${t.q}× ${esc(t.name)}`).join("<br>")}</div>${o.note?`<div class="meta">Note: ${esc(o.note)}</div>`:""}
  <div class="meta" style="margin-top:4px"><b style="color:var(--tx)">${money(o.total)}</b><span class="badge">${o.pay||"Cash"}</span>${staff?"· "+esc(o.who):""}${i>=0&&i<2?`· ~${o.wait||8} min`:""}</div></div></div>
  ${x?`<div class="steps"><span class="badge x">Cancelled</span></div>`:`<div class="steps">${FLOW.map((s,k)=>`<div class="step ${k<i?"done":k===i?(i===3?"done":"now"):""}"><i></i>${s}</div>`).join("")}</div>`}
  <div style="padding:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap">
  ${staff&&i>=0&&i<3?`<button class="btn gold" onclick="advance(${o.token})">Mark ${FLOW[i+1]}</button>`:""}
  ${o.status==="Placed"?`<button class="btn alt" onclick="cancel(${o.token})">Cancel</button>`:""}
  ${!staff?`<button class="btn alt" onclick="reorder(${o.token})">Order again</button>`:""}
  ${!x?`<button class="btn alt" onclick="rcpt=${o.token};render()">Receipt</button>`:""}</div></div>`}
function viewOrders(){
  const L=orders.filter(o=>o.who===me).reverse();
  return L.length?L.map(o=>ticket(o,false)).join(""):`<div class="empty"><span class="em">🧾</span>No orders yet. Pick something tasty from the menu.</div>`;
}
function viewAdmin(){
  const live=active().reverse(),done=orders.filter(o=>o.status==="Collected"),ok=orders.filter(o=>o.status!=="Cancelled");
  const sales=done.reduce((a,o)=>a+o.total,0),byCat={},byItem={};
  ok.forEach(o=>o.items.forEach(x=>{byCat[x.cat||"Other"]=(byCat[x.cat||"Other"]||0)+(x.price||0)*x.q;byItem[x.name]=(byItem[x.name]||0)+x.q}));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]),top=Object.entries(byItem).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bars=(L,f)=>L.length?L.map(([k,v])=>`<div class="bar2"><span>${esc(k)}</span><i style="width:${Math.max(4,v/L[0][1]*55)}%"></i><b>${f(v)}</b></div>`).join(""):`<div class="meta">No sales yet.</div>`;
  return `<div class="stats"><div class="stat"><b>${live.length}</b><span>Cooking now</span></div><div class="stat"><b>${done.length}</b><span>Collected</span></div><div class="stat"><b>${money(sales)}</b><span>Sales</span></div>
  <div class="stat"><b>${money(done.length?Math.round(sales/done.length):0)}</b><span>Avg order</span></div><div class="stat"><b>${orders.filter(o=>o.status==="Cancelled").length}</b><span>Cancelled</span></div><div class="stat"><b>${menu.filter(m=>!avail(m)).length}</b><span>Sold out items</span></div></div>
  <h2>Live orders</h2>`+(live.map(o=>ticket(o,true)).join("")||`<div class="empty"><span class="em">😌</span>No active orders.</div>`)+
  `<h2>Sales by category</h2>${bars(cats,money)}<h2>Top sellers</h2>${bars(top,v=>v+" sold")}
  <h2>Menu and stock <small class="meta" style="display:inline">(${menu.length} items, leave stock empty for unlimited)</small></h2>`+
  menu.map(m=>`<div class="inv"><span class="nm">${esc(m.name)} ${!avail(m)?'<span class="badge x">Sold out</span>':""}</span>
   <input class="f" type="number" min="1" value="${m.price}" onchange="setPrice(${m.id},this.value)" aria-label="Price of ${esc(m.name)}">
   <input class="f" type="number" min="0" placeholder="∞" value="${m.stock??""}" onchange="setStock(${m.id},this.value)" aria-label="Stock of ${esc(m.name)}">
   <button class="btn alt" onclick="toggle(${m.id})">${m.on?"Hide":"Show"}</button><button class="btn alt" onclick="delItem(${m.id})" aria-label="Delete ${esc(m.name)}">Delete</button></div>`).join("")+
  `<h2>Add item</h2><div class="row"><input class="f" id="nn" placeholder="Item name" aria-label="Item name"><input class="f" id="np" type="number" placeholder="Price" aria-label="Price" style="max-width:110px"></div>
  <div class="row"><input class="f" id="nc" placeholder="Category, e.g. Snacks" aria-label="Category"><input class="f" id="ns" type="number" placeholder="Stock" aria-label="Stock" style="max-width:110px"></div>
  <div class="row"><select class="f" id="nt" aria-label="Picture style">${Object.keys(SH).map(k=>`<option>${k}</option>`).join("")}</select><button class="btn" onclick="addItem()">Add item</button></div>
  <div class="row"><button class="btn alt" onclick="exportCSV()">Export orders (CSV)</button><button class="btn alt" onclick="resetAll()">Reset demo data</button></div>`}
function sheetHTML(){
  const t=total(),d=disc();
  return `<div class="sheet-bg" onclick="if(event.target===this){showCart=false;render()}"><div class="sheet"><h2 style="margin-top:0">Your order</h2>`+
  Object.entries(cart).map(([id,n])=>`<div class="line"><span class="who">${art(M(id),44)}<span>${esc(M(id).name)}<br><small class="meta">${money(M(id).price)} each</small></span></span><div class="qty"><button aria-label="Remove one" onclick="add(${id},-1)">−</button><b>${n}</b><button aria-label="Add one" onclick="add(${id},1)">+</button></div></div>`).join("")+
  `<input class="f" id="note" maxlength="80" placeholder="Special instructions (less spicy, no onion)" aria-label="Special instructions" value="${esc(note)}" style="margin-top:12px">
  <div class="row"><input class="f" id="cp" placeholder="Coupon code" aria-label="Coupon code" value="${coupon}"><button class="btn alt" onclick="applyCoupon()">Apply</button></div>
  <div class="meta">Try STUDENT10 for 10% off, or SAVE20 for ₹20 off on ₹150+.</div>
  <div class="opt">${["UPI","Cash","Card"].map(p=>`<button class="chip ${pay===p?"on":""}" onclick="setPay('${p}')">${p}</button>`).join("")}</div>
  <div class="line"><span>Subtotal</span><span>${money(t)}</span></div>${d?`<div class="line"><span>Discount (${coupon})</span><span>−${money(d)}</span></div>`:""}
  <div class="sum"><span>Total</span><span>${money(t-d)}</span></div><button class="btn gold" style="width:100%;padding:14px" onclick="placeOrder()">Place order · pay by ${pay}</button></div></div>`}

function render(){
  const g=h<12?"Good morning":h<17?"Good afternoon":"Good evening",qn=active().length;
  $("#hello").textContent=me?`${g}, ${me.split(" ")[0]}.`:"Skip the queue. Eat on time.";
  $("#sub").textContent="100% vegetarian. "+(h<11?"Breakfast is on until 11. ":"")+(qn?`${qn} order${qn>1?"s":""} in the kitchen, about ${qn*2+5} min wait.`:"Kitchen is free, your food starts right away.");
  $("#board").innerHTML=boardHTML();
  prev=Object.fromEntries(orders.map(o=>[o.token,o.status]));
  const mine=orders.filter(o=>o.who===me&&active().includes(o)).length;
  $("#nav").innerHTML=[["menu","Menu"],["orders","My orders"],["admin","Staff"]].map(([k,l])=>`<button class="tab ${tab===k?"on":""}" onclick="setTab('${k}')">${l}${k==="orders"&&mine?`<span class="n">${mine}</span>`:""}</button>`).join("");
  $("#app").innerHTML=tab==="menu"?viewMenu():tab==="orders"?viewOrders():viewAdmin();
  $("#bar").innerHTML=tab==="menu"&&count()?`<div class="bar"><span>🛒 ${count()} items · <b>${money(total()-disc())}</b></span><button class="btn gold" onclick="showCart=true;render()">View cart</button></div>`:"";
  const ro=rcpt&&orders.find(o=>o.token===rcpt);
  $("#sheet").innerHTML=ro?rcptHTML(ro):showCart?sheetHTML():"";
  const sq=$("#q");if(sq)sq.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
render();
</script>
</body>
</html>
